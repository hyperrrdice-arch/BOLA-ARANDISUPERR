name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24: repo memakai node:sqlite (stabil di 24) dan versi ini
          # yang dipakai lingkungan eksperimen K0.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # GERBANG LINT BASELINE (Fix-6 butir 6): utang lint warisan direkam
      # per (berkas, aturan) di lint-baseline.json (92 error, ter-commit,
      # dapat diaudit — termasuk berkas read-only lib/agent/* yang tidak
      # boleh diubah). Langkah ini MERAH hanya bila ada error BARU di
      # luar baseline; baseline menyusut selalu lolos. Tahap CI berurutan
      # ketat: lint-gate → typecheck → seluruh suite → build (satu job,
      # langkah gagal menghentikan tahap berikutnya).
      - name: Lint gate (baseline eksplisit)
        run: npm run lint:gate

      - name: TypeScript typecheck
        run: npx --no-install tsc --noEmit

      - name: Quant tests (vig + quant-correctness + pick-engine)
        run: npm run test:quant

      - name: Data tests (rantai impor → alias → resolver, jalur hijau)
        run: npm run test:data

      - name: Web adapter tests
        run: npm run test:web

      # Kontrak HTTP /api/matches, /api/odds, /api/agent, /api/betting
      # dengan upstream fixture (parameter invalid, hasil kosong,
      # provider gagal) — Fix-6 butir 6.
      - name: API contract tests
        run: npm run test:api

      - name: E2E mini-pipe tests
        run: npm run test:e2e

      # Baseline D01 adalah langkah TERPISAH. Sejak K1 ia adalah REGRESI
      # WAJIB HIJAU: suite menilai harapan eksplisit acceptance.json
      # (2/2 ter-resolve, [hit, miss], 4 log) DAN kesamaan persis dengan
      # baseline terekam sesudah perbaikan; merah bila perilaku berubah
      # tanpa baseline diperbarui. Histori kegagalan K0 (0/2) tersimpan
      # di tests/baseline/d01-baseline.md.
      - name: D01 baseline (regresi hijau K1)
        run: npm run test:baseline:d01

      # Suite verifikasi produksi (LANJUT-3, berkas pemilik §3): empat
      # suite temuan #1–#4 kini terhubung ke skrip proyek dan CI —
      # sebelumnya hanya lulus lokal terpisah dan tidak pernah jalan
      # di CI. Suite #4 menjalankan probe browser; dependensi browser
      # adalah devDependencies BERVERSI TERKUNCI (puppeteer-core
      # 25.16.0 + @sparticuz/chromium 153.0.0) yang dipasang npm ci,
      # dirujuk lewat tests/helpers/browser-resolve.mjs — gagal keras
      # bila tidak tersedia, tidak pernah skip diam-diam. Suite-suit
      # ini menjalankan `npm run build` internal di checkout, jadi
      # env placeholder yang sama dengan langkah Build berlaku.
      - name: Verification suites (verifikasi produksi #1–#4)
        run: npm run test:verifikasi
        env:
          NINE_ROUTER_BASE_URL: http://localhost:20128/v1
          NINE_ROUTER_API_KEY: <redacted>
          NINE_ROUTER_MODEL: ag/gemini-3.8-flash
          STATS_API_KEY: <redacted>
          RAPIDAPI_1XBET_KEY: dummy-build-only

      # Suite lanjut di branch yang sama (perluasan §3 yang disengaja,
      # dilaporkan sebagai itu): gabungan sadar edisi + probe
      # browsernya, dan retry matriks — branch tidak boleh merge lagi
      # dengan uji tak terhubung.
      - name: Lanjut suites (edisi paket + retry matriks)
        run: npm run test:lanjut
        env:
          NINE_ROUTER_BASE_URL: http://localhost:20128/v1
          NINE_ROUTER_API_KEY: <redacted>
          NINE_ROUTER_MODEL: ag/gemini-3.8-flash
          STATS_API_KEY: <redacted>
          RAPIDAPI_1XBET_KEY: dummy-build-only

      # Build di checkout bersih TIDAK punya .env.local (gitignored), dan
      # lib/llm/models.ts memvalidasi env saat import — tanpa nilai apa pun
      # build gugur di "collect page data for /api/agent". Nilai di bawah
      # adalah placeholder persis contoh .env.example (BUKAN kredensial
      # asli); build hanya butuh variabelnya terisi. Build juga mengambil
      # font lewat next/font/google, jadi langkah ini butuh jaringan —
      # tersedia di runner GitHub.
      - name: Build
        run: npm run build
        env:
          NINE_ROUTER_BASE_URL: http://localhost:20128/v1
          NINE_ROUTER_API_KEY: dummy-build-only
          NINE_ROUTER_MODEL: ag/gemini-3.8-flash
          STATS_API_KEY: dummy-build-only
          RAPIDAPI_1XBET_KEY: dummy-build-only
