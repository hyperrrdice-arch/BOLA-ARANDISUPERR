name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & Quant Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run BFF View-Model tests
        run: npx tsx scripts/test-view-mapper.ts

      - name: Run Value Bet tests
        run: npx tsx scripts/test-value-bets.ts

      - name: Run Quant Scale & Vig-Stripping invariants
        run: npx tsx scripts/test-quant-scale.ts
